[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rvt_py"
version = "2.2.3"
description = "Relief Visualization Toolbox Python library. It helps scientist visualize raster elevation model datasets."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"

authors = [
  { name = "ZRC SAZU and University of Ljubljana (UL FGG)", email = "ziga.kokalj@zrc-sazu.si" }
]

keywords = [
  "relief_visualization_toolbox",
  "relief_visualization",
  "relief",
  "rvt",
  "raster",
  "raster_visualization",
  "visualization",
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
    "geopandas>=1.1.2",
    "matplotlib>=3.10.8",
    "numexpr>=2.14.1",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "rasterio>=1.5.0",
    "scipy>=1.17.0",
]

[project.urls]
Homepage = "https://github.com/EarthObservation/RVT_py"
Documentation = "https://rvt-py.readthedocs.io/en/latest/"
Source = "https://github.com/EarthObservation/RVT_py"
"Old RVT" = "https://iaps.zrc-sazu.si/en/rvt#v"
"ArcGIS Pro" = "https://github.com/EarthObservation/rvt-arcgis-pro"
"QGIS plugin" = "https://github.com/EarthObservation/rvt-qgis"

# Package discovery (replacement for find_packages())
[tool.setuptools.packages.find]
include = ["rvt*"]
